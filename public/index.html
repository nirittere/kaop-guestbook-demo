<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAOP Guestbook Demo</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <p class="eyebrow">KAOP LIVE DEMO</p>
    <h1>Guestbook</h1>
    <p class="intro">A small Go and Redis service used to demonstrate governed incident investigation.</p>
    <form id="entry-form">
      <label for="message">Leave a message</label>
      <div class="form-row">
        <input id="message" name="message" required maxlength="120" autocomplete="off">
        <button type="submit">Add entry</button>
      </div>
    </form>
    <p id="status" role="status"></p>
    <ul id="entries"></ul>
  </main>
  <script src="/script.js"></script>
</body>
</html>
