apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaop-investigator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kaop-investigator
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaop-investigator
subjects:
  - kind: ServiceAccount
    name: kaop-investigator
    namespace: kaop-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kaop-investigator

